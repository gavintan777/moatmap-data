name: Monthly update

# The Best Stocks editions form on the 1st and the decile vintage around the
# 10th, so the 4th and the 14th each pick up one of them. A run with nothing
# new commits nothing.
on:
  schedule:
    - cron: "17 6 4,14 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the latest published data
        run: python scripts/update.py --out .
      - name: Commit if anything changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No new data."
            exit 0
          fi
          git config user.name "moatmap-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
