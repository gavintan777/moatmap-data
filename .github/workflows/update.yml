name: Weekly update

# The Best Stocks editions form on the first weeknight of a month (sometimes
# later, and an edition can be re-formed after a fix) and the decile vintage
# around the 10th. The site's API serves only each market's newest edition, so
# a run must catch every month while it is the newest: weekly, every
# Wednesday, after the nightly. A run with nothing new commits nothing.
on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the latest published data
        run: python scripts/update.py --out .
      - name: Commit if anything changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No new data."
            exit 0
          fi
          git config user.name "moatmap-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
